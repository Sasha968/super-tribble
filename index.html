<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Сияние - 3 в ряд</title>
<style>
    * { 
        -webkit-tap-highlight-color: transparent; 
        touch-action: none;
        user-select: none;
    }
    body {
        margin: 0;
        background: #0f0f1a;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
    }
    h1 {
        margin: 0 0 10px 0;
        background: linear-gradient(90deg, #ff3366, #ffcc00, #33ff99);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 2px;
    }
    #score {
        font-size: 20px;
        margin-bottom: 10px;
        color: #ccc;
    }
    /* CSS растягивает канвас, но внутри он маленький для скорости */
    canvas {
        background: #1a1a2a;
        border: 2px solid #333;
        border-radius: 12px;
        width: 90vw;
        height: 90vw;
        max-width: 400px;
        max-height: 400px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #resetBtn {
        margin-top: 15px;
        padding: 10px 30px;
        font-size: 16px;
        background: #333;
        color: white;
        border: 1px solid #555;
        border-radius: 20px;
        cursor: pointer;
    }
    #resetBtn:active { background: #555; }
</style>
</head>
<body>
<h1>СИЯНИЕ</h1>
<div id="score">Счет: 0</div>
<canvas id="game"></canvas>
<button id="resetBtn">Заново</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false }); // alpha: false ускоряет отрисовку
const scoreEl = document.getElementById('score');
const resetBtn = document.getElementById('resetBtn');

// ВНУТРЕННЕЕ разрешение маленькое для скорости на телефонах
canvas.width = 400;
canvas.height = 400;

const GRID_SIZE = 8;
const CELL_SIZE = canvas.width / GRID_SIZE; // 50px
const COLORS = ['#ff3366', '#33ff99', '#3399ff', '#ffcc00', '#cc33ff', '#33ffcc'];

let grid = [];
let score = 0;
let selected = null;
let state = 'idle';
let particles = [];
let floatingTexts = [];
let shakeTime = 0;
let pulseTime = 0;
let animProgress = 0;
let swapData = null;
let removeData = null;
let inputLocked = false;

function createCell(color) {
    return { color, x: 0, y: 0, targetX: 0, targetY: 0, scale: 1, alpha: 1 };
}

function initGrid() {
    grid = [];
    for (let i = 0; i < GRID_SIZE; i++) {
        grid[i] = [];
        for (let j = 0; j < GRID_SIZE; j++) {
            const c = Math.floor(Math.random() * COLORS.length);
            grid[i][j] = createCell(c);
            grid[i][j].x = grid[i][j].targetX = j * CELL_SIZE;
            grid[i][j].y = grid[i][j].targetY = i * CELL_SIZE;
        }
    }
    let safety = 0;
    while (findMatches().length > 0 && safety < 100) {
        for (let i = 0; i < GRID_SIZE; i++) {
            for (let j = 0; j < GRID_SIZE; j++) {
                grid[i][j].color = Math.floor(Math.random() * COLORS.length);
            }
        }
        safety++;
    }
}

function findMatches() {
    const matches = new Set();
    for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE - 2; j++) {
            const a = grid[i][j], b = grid[i][j+1], c = grid[i][j+2];
            if (a && b && c && a.color >= 0 && a.color === b.color && a.color === c.color) {
                matches.add(i+','+j); matches.add(i+','+(j+1)); matches.add(i+','+(j+2));
            }
        }
    }
    for (let i = 0; i < GRID_SIZE - 2; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
            const a = grid[i][j], b = grid[i+1][j], c = grid[i+2][j];
            if (a && b && c && a.color >= 0 && a.color === b.color && a.color === c.color) {
                matches.add(i+','+j); matches.add((i+1)+','+j); matches.add((i+2)+','+j);
            }
        }
    }
    return Array.from(matches).map(s => s.split(',').map(Number));
}

function spawnParticles(i, j, color) {
    if (particles.length > 40) return; // Жёсткий лимит для слабых телефонов
    const cx = j * CELL_SIZE + CELL_SIZE / 2;
    const cy = i * CELL_SIZE + CELL_SIZE / 2;
    for (let k = 0; k < 6; k++) { // Меньше частиц
        const angle = (Math.PI * 2 * k) / 6;
        const speed = 2 + Math.random() * 2;
        particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color: COLORS[color],
            size: 4
        });
    }
}

function spawnFloatingText(i, j, text) {
    floatingTexts.push({ x: j * CELL_SIZE + CELL_SIZE / 2, y: i * CELL_SIZE + CELL_SIZE / 2, text, life: 1, vy: -1 });
}

function startSwap(i1, j1, i2, j2) {
    state = 'swapping';
    animProgress = 0;
    inputLocked = true;
    const c1 = grid[i1][j1], c2 = grid[i2][j2];
    swapData = {
        i1, j1, i2, j2,
        fx1: c1.x, fy1: c1.y, fx2: c2.x, fy2: c2.y,
        tx1: j1 * CELL_SIZE, ty1: i1 * CELL_SIZE,
        tx2: j2 * CELL_SIZE, ty2: i2 * CELL_SIZE,
        reverse: false
    };
}

function startReverseSwap() {
    const { i1, j1, i2, j2 } = swapData;
    const tmp = grid[i1][j1]; grid[i1][j1] = grid[i2][j2]; grid[i2][j2] = tmp;
    swapData.reverse = true;
    swapData.fx1 = swapData.tx1; swapData.fy1 = swapData.ty1;
    swapData.fx2 = swapData.tx2; swapData.fy2 = swapData.ty2;
    swapData.tx1 = j1 * CELL_SIZE; swapData.ty1 = i1 * CELL_SIZE;
    swapData.tx2 = j2 * CELL_SIZE; swapData.ty2 = i2 * CELL_SIZE;
    animProgress = 0;
}

function finishSwap() {
    const { i1, j1, i2, j2, reverse, tx1, ty1, tx2, ty2 } = swapData;
    if (grid[i1][j1]) { grid[i1][j1].x = tx1; grid[i1][j1].y = ty1; grid[i1][j1].targetX = tx1; grid[i1][j1].targetY = ty1; }
    if (grid[i2][j2]) { grid[i2][j2].x = tx2; grid[i2][j2].y = ty2; grid[i2][j2].targetX = tx2; grid[i2][j2].targetY = ty2; }
    
    if (reverse) {
        shakeTime = 0.2;
        state = 'idle';
        inputLocked = false;
        swapData = null;
        return;
    }
    const tmp = grid[i1][j1]; grid[i1][j1] = grid[i2][j2]; grid[i2][j2] = tmp;
    const matches = findMatches();
    if (matches.length === 0) {
        startReverseSwap();
    } else {
        startRemove(matches);
    }
    swapData = null;
}

function startRemove(matches) {
    state = 'removing';
    animProgress = 0;
    removeData = { matches };
    for (const [i, j] of matches) {
        if (grid[i][j]) spawnParticles(i, j, grid[i][j].color);
    }
    if (matches.length > 0) {
        spawnFloatingText(matches[0][0], matches[0][1], '+' + (matches.length * 10));
    }
    score += matches.length * 10;
    scoreEl.textContent = 'Счет: ' + score;
}

function finishRemove() {
    const { matches } = removeData;
    for (const [i, j] of matches) grid[i][j] = null;
    
    for (let j = 0; j < GRID_SIZE; j++) {
        let empty = 0;
        for (let i = GRID_SIZE - 1; i >= 0; i--) {
            if (grid[i][j] === null) empty++;
            else if (empty > 0) {
                grid[i + empty][j] = grid[i][j];
                grid[i + empty][j].targetY = (i + empty) * CELL_SIZE;
                grid[i + empty][j].targetX = j * CELL_SIZE;
                grid[i + empty][j].y = i * CELL_SIZE;
                grid[i][j] = null;
            }
        }
        for (let i = 0; i < empty; i++) {
            const cell = createCell(Math.floor(Math.random() * COLORS.length));
            cell.targetX = j * CELL_SIZE;
            cell.targetY = i * CELL_SIZE;
            cell.x = j * CELL_SIZE;
            cell.y = -(empty - i) * CELL_SIZE;
            grid[i][j] = cell;
        }
    }
    removeData = null;
    state = 'falling';
    animProgress = 0;
}

function finishFall() {
    for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
            if (!grid[i][j]) continue;
            grid[i][j].x = grid[i][j].targetX;
            grid[i][j].y = grid[i][j].targetY;
            grid[i][j].scale = 1;
            grid[i][j].alpha = 1;
        }
    }
    const matches = findMatches();
    if (matches.length > 0) startRemove(matches);
    else { state = 'idle'; inputLocked = false; }
}

function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

function update(dt) {
    pulseTime += dt;
    if (shakeTime > 0) shakeTime -= dt;
    
    for (let k = particles.length - 1; k >= 0; k--) {
        const p = particles[k];
        p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= dt * 2;
        if (p.life <= 0) particles.splice(k, 1);
    }
    for (let k = floatingTexts.length - 1; k >= 0; k--) {
        const t = floatingTexts[k];
        t.y += t.vy; t.life -= dt * 1.5;
        if (t.life <= 0) floatingTexts.splice(k, 1);
    }
    
    if (state === 'swapping' && swapData) {
        animProgress += dt * 4;
        if (animProgress >= 1) { animProgress = 1; finishSwap(); }
        else {
            const t = easeInOut(animProgress);
            const { i1, j1, i2, j2, fx1, fy1, fx2, fy2, tx1, ty1, tx2, ty2 } = swapData;
            if (grid[i1][j1]) { grid[i1][j1].x = fx1 + (tx1 - fx1) * t; grid[i1][j1].y = fy1 + (ty1 - fy1) * t; }
            if (grid[i2][j2]) { grid[i2][j2].x = fx2 + (tx2 - fx2) * t; grid[i2][j2].y = fy2 + (ty2 - fy2) * t; }
        }
    } else if (state === 'removing' && removeData) {
        animProgress += dt * 3;
        if (animProgress >= 1) { animProgress = 1; finishRemove(); }
        else {
            const t = easeOut(animProgress);
            for (const [i, j] of removeData.matches) {
                if (grid[i][j]) { grid[i][j].scale = 1 - t; grid[i][j].alpha = 1 - t; }
            }
        }
    } else if (state === 'falling') {
        animProgress += dt * 3;
        let allDone = true;
        for (let i = 0; i < GRID_SIZE; i++) {
            for (let j = 0; j < GRID_SIZE; j++) {
                const cell = grid[i][j];
                if (!cell) continue;
                const dx = cell.targetX - cell.x, dy = cell.targetY - cell.y;
                if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
                    cell.x += dx * 0.25; cell.y += dy * 0.25; allDone = false;
                } else { cell.x = cell.targetX; cell.y = cell.targetY; }
            }
        }
        if (animProgress >= 1.5 || allDone) finishFall();
    }
}

function draw() {
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    if (shakeTime > 0) {
        const s = shakeTime * 10;
        ctx.save();
        ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    for (let i = 0; i < GRID_SIZE; i++) {
        for (let j = 0; j < GRID_SIZE; j++) {
            const cell = grid[i][j];
            if (!cell || cell.color < 0) continue;
            
            const size = (CELL_SIZE - 6) * cell.scale;
            const x = cell.x + (CELL_SIZE - size) / 2;
            const y = cell.y + (CELL_SIZE - size) / 2;
            const r = 8;

            ctx.globalAlpha = cell.alpha;
            ctx.fillStyle = COLORS[cell.color];
            
            // Быстрая отрисовка скругленного прямоугольника
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + size - r, y);
            ctx.quadraticCurveTo(x + size, y, x + size, y + r);
            ctx.lineTo(x + size, y + size - r);
            ctx.quadraticCurveTo(x + size, y + size, x + size - r, y + size);
            ctx.lineTo(x + r, y + size);
            ctx.quadraticCurveTo(x, y + size, x, y + size - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();

            // Дешёвый блик вместо тяжёлого градиента
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.beginPath();
            ctx.arc(x + size*0.3, y + size*0.3, size*0.15, 0, Math.PI*2);
            ctx.fill();

            if (selected && selected[0] === i && selected[1] === j && state === 'idle') {
                const pulse = 0.5 + 0.5 * Math.sin(pulseTime * 6);
                ctx.strokeStyle = `rgba(255,255,255,${0.5 + pulse * 0.5})`;
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }
    }
    
    // Частицы (квадратами, это в 3 раза быстрее кругов)
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    
    // Текст
    for (const t of floatingTexts) {
        ctx.globalAlpha = t.life;
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(t.text, t.x, t.y);
    }
    
    if (shakeTime > 0) ctx.restore();
}

function handleInput(clientX, clientY) {
    if (inputLocked || state !== 'idle') return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;
    const j = Math.floor(x / CELL_SIZE);
    const i = Math.floor(y / CELL_SIZE);
    
    if (i < 0 || i >= GRID_SIZE || j < 0 || j >= GRID_SIZE || !grid[i][j]) return;

    if (!selected) {
        selected = [i, j];
    } else {
        const [si, sj] = selected;
        if (si === i && sj === j) { selected = null; return; }
        if (Math.abs(si - i) + Math.abs(sj - j) === 1) {
            startSwap(si, sj, i, j);
            selected = null;
        } else {
            selected = [i, j];
        }
    }
}

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener('click', (e) => handleInput(e.clientX, e.clientY));

document.addEventListener('touchmove', (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });

resetBtn.addEventListener('click', () => {
    score = 0; scoreEl.textContent = 'Счет: 0';
    selected = null; state = 'idle'; inputLocked = false;
    swapData = null; removeData = null;
    particles = []; floatingTexts = [];
    initGrid();
});

let lastTime = performance.now();
function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
}

initGrid();
requestAnimationFrame(loop);
</script>
</body>
</html>
